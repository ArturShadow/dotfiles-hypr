########################################
#  KEYBINDS – estilo Windows + Hyprland
########################################

$mainMod = SUPER


###############
# Lanzadores  #
###############

bind = $mainMod, Return, exec, kitty
bind = $mainMod, E, exec, thunar
bind = $mainMod SHIFT, E, exec, wlogout
bind = $mainMod, R, exec, wofi -S run -I
bind = ALT, SPACE, exec, wofi -S drun -I
bind = $mainMod, x, exec, hyprpicker -a
bind = $mainMod, PERIOD, exec, wofi-emoji
bind = $mainMod, B, exec, ~/.config/waybar/scripts/toggle.sh



#################
# Gestión WM    #
#################

bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, SPACE, togglefloating,


#######################
# Bloqueo / sistema   #
#######################

bind = $mainMod, L, exec, ~/.config/hypr/scripts/lock.sh
bind = CTRL ALT, Delete, exit,
bind = $mainMod SHIFT, R, exec, hypr reload,


#########################
# Foco y movimiento     #
#########################

# Cambiar foco (Win + flechas)
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Mover ventana (Win + Shift + flechas)
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d


#########################
# “Alt + Tab” clásico   #
#########################

bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev


#########################
# Workspaces            #
#########################

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
# Workspaces 11-20 con numpad
bind = $mainMod, KP_1, workspace, 11
bind = $mainMod, KP_2, workspace, 12
bind = $mainMod, KP_3, workspace, 13
bind = $mainMod, KP_4, workspace, 14
bind = $mainMod, KP_5, workspace, 15
bind = $mainMod, KP_6, workspace, 16
bind = $mainMod, KP_7, workspace, 17
bind = $mainMod, KP_8, workspace, 18
bind = $mainMod, KP_9, workspace, 19
bind = $mainMod, KP_0, workspace, 20

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
# Mover ventana a workspaces 11-20 con numpad
bind = $mainMod SHIFT, KP_1, movetoworkspace, 11
bind = $mainMod SHIFT, KP_2, movetoworkspace, 12
bind = $mainMod SHIFT, KP_3, movetoworkspace, 13
bind = $mainMod SHIFT, KP_4, movetoworkspace, 14
bind = $mainMod SHIFT, KP_5, movetoworkspace, 15
bind = $mainMod SHIFT, KP_6, movetoworkspace, 16
bind = $mainMod SHIFT, KP_7, movetoworkspace, 17
bind = $mainMod SHIFT, KP_8, movetoworkspace, 18
bind = $mainMod SHIFT, KP_9, movetoworkspace, 19
bind = $mainMod SHIFT, KP_0, movetoworkspace, 20

bind = ALT, w, togglespecialworkspace, work
bind = ALT, I, togglespecialworkspace, imvu
bind = ALT SHIFT, W, exec, hyprctl dispatch workspace 11; sleep 2.0; ~/run-bb.sh

# Siguiente workspace
bind = SUPER CTRL, right, workspace, e+1

# Workspace anterior
bind = SUPER CTRL, left, workspace, e-1


#########################
# Monitores             #
#########################

# Foco monitor (Win + Ctrl + flechas)
bind = $mainMod CTRL, left,  focusmonitor, l
bind = $mainMod CTRL, right, focusmonitor, r

# Mover ventana a otro monitor (Win + Shift + Ctrl + flechas)
bind = $mainMod CTRL SHIFT, left,  movewindow, mon:l
bind = $mainMod CTRL SHIFT, right, movewindow, mon:r


#########################
# Volumen y brillo      #
#########################

bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

bind = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = $mainMod CTRL, S, exec, grim -g "$(slurp)" - | wl-copy && canberra-gtk-play -i screen-capture

bind = CTRL SHIFT, ESCAPE, exec, kitty -e btop
bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = SUPER SHIFT, F7, exec, ~/.config/hypr/scripts/battery-profile.sh desk
bind = SUPER SHIFT, F8, exec, ~/.config/hypr/scripts/battery-profile.sh normal
bind = SUPER SHIFT, F9, exec, ~/.config/hypr/scripts/battery-profile.sh travel
bind = SUPER SHIFT, F10, exec, ~/.config/hypr/scripts/battery-profile.sh full
bind = SUPER, B, exec, ~/.config/hypr/scripts/battery-menu.sh
bind = CTRL, Print, exec, grim -g "$(slurp)" - | wl-copy
