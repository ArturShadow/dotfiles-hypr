# Opacidad / blur
background_opacity         0.90
dynamic_background_opacity yes
background_blur            3

# Ventana
window_padding_width       10
window_margin_width        0

# Cursor
cursor_shape               beam
cursor_blink_interval     -1
cursor_trail               1

# Scrollback
scrollback_lines           15000
scrollback_pager           less +F
touch_scroll_multiplier    2

# Shell
shell zsh

# Permite que Yazi detecte el protocolo de imágenes de Kitty.
term xterm-kitty

# Performance
repaint_delay              5
input_delay                2
