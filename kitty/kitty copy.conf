# ========================
#     KITTY CONFIG BASE
# ========================

font_family      Hack Nerd Font
bold_font        Hack Nerd Font Bold
italic_font      Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size        16

# --- Rendering ---
disable_ligatures never
adjust_line_height  120%
adjust_column_width 110%

# --- Window styling ---
background_opacity    0.90
#background_blur       3  # solo si tienes hyprland blur
dynamic_background_opacity yes

window_padding_width  10
window_margin_width   0

cursor_shape     beam
cursor_blink     on
cursor_trail     1

# --- Colors: Catppuccin Mocha ---
include ./themes/catppuccin-mocha.conf

# --- Scroll y comportamiento ---
scrollback_lines 15000
scrollback_pager less +F
touch_scroll_multiplier 2

# --- Keybindings ---
map ctrl+shift+enter    new_window
map ctrl+shift+t        new_tab
map ctrl+shift+w        close_window
map ctrl+shift+h        previous_tab
map ctrl+shift+l        next_tab
map ctrl+shift+f        search

# Zoom
map ctrl+plus            increase_font_size
map ctrl+minus           decrease_font_size
map ctrl+0               reset_font_size

# --- Clipboard ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# --- Shell por defecto ---
shell zsh

# --- Integración con Wayland ---
enable_wayland yes

# --- Performance ---
repaint_delay 5
input_delay 2
